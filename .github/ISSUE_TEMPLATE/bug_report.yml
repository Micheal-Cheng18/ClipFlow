name: 问题反馈
description: 报告可以复现的 ClipFlow 问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 ClipFlow。请使用示例文本或图片复现，不要上传真实剪贴板历史、密码、令牌或个人敏感信息。
        安全漏洞请通过 [私密安全报告](https://github.com/Micheal-Cheng18/ClipFlow/security/advisories/new) 提交；若该入口不可用，请等待启用，不要公开漏洞细节。
  - type: input
    id: version
    attributes:
      label: ClipFlow 版本
      description: 填写实际版本号，可在面板标题或安装包名称中查看；不要只写“最新版”。
      value: "0.7.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: ClipFlow 需要 macOS 14 或更新版本。
      placeholder: "例如：macOS 14.7.1"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon（M 系列）
        - Intel
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 安装方式
      options:
        - GitHub Releases 安装包
        - 从源码构建
        - 其他方式
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题表现
      description: 描述实际发生的行为，以及是否每次都会出现。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用不含敏感信息的示例内容，列出最少的操作步骤。
      placeholder: |
        1. 复制示例文本“ClipFlow 测试”
        2. 打开剪贴板面板
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望应用如何表现？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关环境与截图（可选）
      description: 如与问题有关，可补充辅助功能是否授权、唤起快捷键、目标应用、深浅色模式或多屏情况。截图请只使用示例内容并遮盖个人信息。
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 仅附与问题有关且已脱敏的少量日志。请勿上传 history.json、完整剪贴板历史、凭据、签名证书或含个人信息的系统报告。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 此报告及其附件不包含真实剪贴板历史、密码、令牌或个人敏感信息。
          required: true
