name: 功能建议
description: 描述希望 ClipFlow 解决的使用问题。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请用示例内容描述需求，不要附真实剪贴板历史或个人敏感信息。
        安全漏洞请使用 [私密安全报告](https://github.com/Micheal-Cheng18/ClipFlow/security/advisories/new)；入口不可用时，请等待启用，不要在公开 Issue 中披露。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你在什么情况下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述建议的功能、交互或具体示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法（可选）
      description: 目前如何处理？哪些地方仍不方便？
  - type: textarea
    id: privacy
    attributes:
      label: 权限与隐私影响（可选）
      description: 若建议涉及联网、同步、存储或新增系统权限，请说明预期范围。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 隐私确认
      options:
        - label: 此建议及其附件不包含真实剪贴板历史、凭据或个人敏感信息。
          required: true
