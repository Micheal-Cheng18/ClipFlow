name: macOS Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build and verify app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipFlow-macOS
          path: dist/
